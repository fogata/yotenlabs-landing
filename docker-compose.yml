services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yotenlabs-landing
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3003}:3000"
    environment:
      NODE_ENV: production
    networks:
      - default
      - health-platform

networks:
  health-platform:
    external: true
    name: health-platform
